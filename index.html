<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pedidos Lolita</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pedidos Lolita">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f4f4f9; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
                background: #fff; font-family: Arial, sans-serif; color: #555; font-size: 15px; transition: opacity 0.3s; }
    #cargando img { width: 140px; height: 140px; }
  </style>
</head>
<body>
  <div id="cargando"><img src="icon-192.png" alt="Lolita Gluten Free Pastry"><div>Cargando pedidos…</div></div>
  <iframe id="app" title="Pedidos Lolita" allow="camera; clipboard-write"></iframe>

  <script>
    // ⬇️ PEGA AQUÍ el link de tu app de pedidos (el que termina en /exec), entre las comillas
    var LINK_APP = "https://script.google.com/macros/s/AKfycbwEDKf24TkHQFZNgjPywqPssyPQeyAerblNel6nkwuSNeLopBMsD4Mq_yT-f2nPNRdAnQ/exec";

    var marco = document.getElementById('app');
    marco.addEventListener('load', function() {
      var c = document.getElementById('cargando');
      c.style.opacity = 0;
      setTimeout(function() { c.remove(); }, 300);
    });
    marco.src = LINK_APP;

    // Necesario para que el celular ofrezca "Instalar app"
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
</body>
</html>
